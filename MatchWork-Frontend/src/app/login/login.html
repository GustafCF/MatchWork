<div class="container">
    <div class="title">
        <h1>Login</h1>
    </div>
    <form (ngSubmit)="onSubmit()">
        <div class="camps">
            <label for="email">Email</label>
            <input type="email" id="email" name="email" placeholder="ex: gcf@email.com" [(ngModel)]="loginRequest.email">
            <label for="password">Password</label>
            <input type="password" name="password" id="password" [(ngModel)]="loginRequest.password">
        </div>
        <button type="submit" class="button">Login</button>
        <a routerLink="/cadastro">Cadastre-se aqui!</a>
    </form>
</div>
