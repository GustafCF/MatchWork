<div class="search">
        <label for="search">Pesquisar vagas</label>
        <input type="text" name="search" id="search">
</div>

<div class="container">
    <div class="title">
        <h1>Todas as vagas de </h1>
        <p>Número de vagas</p>
    </div>
    @for (job of jobs; track loadJobs()) {
        <div class="sub-container">
            <img src="/public/favicon.ico" alt="">
            <h2>{{ job.name }}</h2>
            <p>{{ job.description }}</p>
            <p>{{ job.jobModel }}</p>
            <p>{{ job.typeContract }}</p>
            <p>{{ job.date }}</p>
        </div>
    }
</div>
